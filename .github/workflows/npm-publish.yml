name: Publish npm

on:
  # A finished release triggers the website deploy (pages.yml), which mirrors the release's
  # binaries. The npm package downloads them from the website, so publish only after that
  # deploy has succeeded.
  workflow_run:
    workflows: [Deploy website]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Skip website deploys that were not started by a release (ordinary site pushes).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      # Publish exactly what was released, not whatever main holds now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm to latest
        run: npm install -g npm@latest
      - name: Skip a version that is already on npm
        id: check
        # `npm view` exits 0 with no output for a version that doesn't exist, so compare the output.
        run: |
          if [ "$(npm view "@willh/say@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@willh/say@$VERSION is already on npm."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Align npm version with the release tag
        if: steps.check.outputs.skip != 'true'
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version
      # No --provenance: npm only issues provenance for packages built from public repositories.
      # npm may stage the version instead of releasing it; a maintainer then approves it with
      # 2FA (npmjs.com > the package > Staged Packages, or `npm stage approve`).
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          SAY_RELEASE_ASSET_RETRIES: 12
          SAY_RELEASE_ASSET_RETRY_DELAY_MS: 10000
        run: |
          set +e
          npm publish --access public 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "previously staged version" publish.log; then
            echo "::warning::@willh/say@$VERSION is already staged on npm and waits for a maintainer's 2FA approval."
            exit 0
          fi
          exit "$status"
      - name: Report whether the version is live
        if: steps.check.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "@willh/say@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "::notice::@willh/say@$VERSION is live on npm."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::@willh/say@$VERSION is staged on npm. Approve it with 2FA at https://www.npmjs.com/package/@willh/say (Staged Packages) or with npm stage approve."
