name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # Serve the installers at https://say.gh.miniasp.com/install.sh and /install.ps1.
      - name: Add install scripts
        run: cp install.sh install.ps1 site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
